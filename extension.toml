id = "csv-toolkit"
name = "CSV Toolkit"
version = "0.3.0"
schema_version = 1
authors = ["Kolen Cheung <10970208+ickc@users.noreply.github.com>"]
description = "Rainbow columns for CSV/TSV/SSV/PSV plus a lightweight language server: ragged-row diagnostics, column-aware hover, an inline table view, and markdown-table preview."
repository = "https://github.com/ickc/zed-csv-toolkit"

[grammars.csv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "csv"

[grammars.tsv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "tsv"

[grammars.ssv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "ssv"

[grammars.psv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "psv"

[language_servers.csv-ls]
name = "CSV Language Server"
languages = ["CSV", "TSV", "SSV", "PSV"]
