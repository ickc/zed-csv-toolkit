name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # rustup itself comes from this action; everything else (toolchain,
      # wasm target, lint/test/build) runs through pixi tasks so CI stays a
      # thin wrapper around the same commands used locally.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Lint, test, and build
        run: pixi run ci

      - name: Package csv-ls
        run: |
          mkdir -p dist
          tar czf "dist/csv-ls-${{ matrix.target }}.tar.gz" -C target/release csv-ls

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: csv-ls-${{ matrix.target }}
          path: dist/*.tar.gz

      - name: Package extension WASM
        if: matrix.os == 'ubuntu-latest'
        run: cp target/wasm32-wasip1/release/zed_csv_toolkit.wasm dist/

      - uses: actions/upload-artifact@v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: extension-wasm
          path: dist/zed_csv_toolkit.wasm

  # On version tags, publish csv-ls binaries as release assets. The Zed
  # extension downloads these at install time (once the repo is public).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: csv-ls-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
