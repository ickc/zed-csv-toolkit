[workspace]
authors = ["Kolen Cheung <10970208+ickc@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "zed-csv-toolkit"
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

# bash is genuinely used by the tasks below, and a non-empty dependency list
# keeps setup-pixi's post-install `pixi list --locked` from erroring in CI.
[dependencies]
bash = "*"

# Rust comes from the system rustup (~/.rustup, ~/.cargo). Pin the toolchain
# via env var instead of mutating the user's `rustup default`, and make sure
# cargo is on PATH even when the invoking shell didn't source cargo's env.
[activation.env]
RUSTUP_TOOLCHAIN = "stable"
PATH = "$HOME/.cargo/bin:$PATH"

[tasks]
# Idempotent check/install of the stable toolchain + wasm32-wasip1 target
# (required by Zed extensions) through the system rustup.
bootstrap-rust = "bash scripts/bootstrap-rust.sh"

# The csv-ls language server (native binary).
build-lsp = { cmd = "cargo build --release --package csv-ls", depends-on = ["bootstrap-rust"] }

# The Zed extension itself (WASM). Zed rebuilds this on "Install Dev Extension";
# this task exists to catch compile errors locally/in CI.
build-wasm = { cmd = "cargo build --release --target wasm32-wasip1 --package zed-csv-toolkit", depends-on = ["bootstrap-rust"] }

build = { depends-on = ["build-lsp", "build-wasm"] }

test = { cmd = "cargo test --workspace", depends-on = ["bootstrap-rust"] }
fmt = { cmd = "cargo fmt --all", depends-on = ["bootstrap-rust"] }
lint = { cmd = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings", depends-on = ["bootstrap-rust"] }
ci = { depends-on = ["lint", "test", "build"] }
